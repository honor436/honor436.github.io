<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서버 테스트 — Tmap 요청 테스터</title>
<meta name="description" content="Tmap 채널 API 요청을 환경별(상용/준상용/개발)로 편집·전송하고 응답을 확인하는 테스터.">
<style>
  :root{
    --bg:#0b1220; --panel:#0f172a; --panel2:#111c30; --border:rgba(148,163,184,.18);
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent-soft:rgba(56,189,248,.12);
    --green:#22c55e; --red:#f87171; --amber:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans KR",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  a{color:var(--accent);text-decoration:none}

  header.site{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(11,18,32,.75);position:sticky;top:0;z-index:10}
  header.site .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  header.site .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:grid;place-items:center;color:#0b1220;font-weight:900;font-size:12px}
  header.site nav{display:flex;gap:8px;font-size:13px}
  header.site nav a{color:var(--muted);padding:6px 10px;border-radius:6px}
  header.site nav a:hover{color:var(--text);background:var(--accent-soft)}

  .layout{flex:1;display:flex;min-height:0}
  /* ---- 좌측 메뉴 (요청 타입, 확장 가능) ---- */
  aside.menu{width:230px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:14px 10px}
  aside.menu .menu-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:6px 8px 10px}
  .menu-item{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;border-radius:9px;background:none;color:var(--text);font-size:13.5px;cursor:pointer;margin-bottom:4px}
  .menu-item:hover{background:var(--panel2)}
  .menu-item.active{background:var(--accent-soft);border-color:rgba(56,189,248,.4);color:var(--accent);font-weight:700}
  .menu-item .mi-path{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:400;word-break:break-all}
  .menu-item .mi-wip{font-size:9.5px;font-weight:800;color:#1a1300;background:var(--amber);padding:1px 6px;border-radius:8px;vertical-align:middle}

  /* ---- 본문 ---- */
  main.content{flex:1;min-width:0;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  h1.page-title{font-size:18px;font-weight:800}
  h1.page-title small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}

  .cors-note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);color:#fde68a;border-radius:8px;padding:8px 12px;font-size:11.5px;line-height:1.6}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted);font-weight:600}
  select,input,textarea,button{font-family:inherit}
  select,input[type=text]{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  input#st-url{flex:1;min-width:280px}
  textarea{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical;outline:none}
  textarea#st-headers{height:150px}
  textarea#st-body{height:230px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  .btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--accent);color:#06243a}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);font-weight:600;padding:9px 12px}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---- 응답 뷰어 ---- */
  .resp{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
  .resp-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;background:var(--panel2)}
  .resp-badge{padding:2px 9px;border-radius:10px;font-weight:700;font-size:11px}
  .resp-badge.ok{background:rgba(34,197,94,.16);color:#86efac}
  .resp-badge.err{background:rgba(248,113,113,.16);color:#fca5a5}
  .resp-meta{color:var(--muted)}
  .resp-hint{padding:8px 14px;color:#fca5a5;font-size:12px;border-bottom:1px solid var(--border);display:none}
  .resp-hint.show{display:block}
  .resp-body{margin:0;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:46vh;overflow:auto;color:#cbd5e1}
  details.resp-headers{border-top:1px solid var(--border)}
  details.resp-headers summary{padding:8px 14px;cursor:pointer;font-size:12px;color:var(--muted)}
  details.resp-headers pre{margin:0;padding:0 14px 12px;font-size:11px;color:#94a3b8;white-space:pre-wrap;word-break:break-all}
  .resp-empty{padding:18px 14px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header class="site">
  <div class="brand"><div class="logo">h</div><div>서버 테스트</div></div>
  <nav>
    <a href="../">← 도구 모음</a>
    <a href="https://github.com/honor436/honor436.github.io" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<div class="layout">
  <aside class="menu">
    <div class="menu-title">요청 타입</div>
    <div id="st-menu"></div>
  </aside>

  <main class="content">
    <h1 class="page-title">Tmap 요청 테스터 <small id="st-current-label"></small></h1>
    <div class="cors-note">
      ⚠ 정적 사이트라 브라우저가 직접 호출합니다 — 서버에 <b>CORS</b> 가 열려있지 않으면 응답을 받을 수 없습니다(프록시/CORS 확장 필요).
      또한 <b>AccessKey/AccessToken</b> 미입력·만료 시 채널이 거부합니다.
    </div>

    <div class="row">
      <div class="field"><label>환경</label>
        <select id="st-env">
          <option value="prod">상용</option>
          <option value="stg" selected>준상용</option>
          <option value="dev">개발</option>
        </select>
      </div>
      <div class="field"><label>Method</label>
        <select id="st-method"><option>POST</option><option>GET</option></select>
      </div>
      <div class="field" style="flex:1"><label>URL</label>
        <input type="text" id="st-url" spellcheck="false">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>요청 헤더 (Key: Value, 한 줄에 하나 · AccessKey/AccessToken 필수)</label>
        <textarea id="st-headers" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label>요청 데이터 (JSON)</label>
        <textarea id="st-body" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="row">
      <button class="btn btn-primary" id="st-send">요청 전송</button>
      <button class="btn btn-ghost" id="st-prettify">JSON 정렬</button>
      <button class="btn btn-ghost" id="st-reset">샘플 복원</button>
    </div>

    <div class="field">
      <label>응답 데이터</label>
      <div class="resp">
        <div class="resp-head" id="st-resp-head"><span class="resp-meta">아직 요청을 보내지 않았습니다.</span></div>
        <div class="resp-hint" id="st-resp-hint"></div>
        <details class="resp-headers" id="st-resp-headers-wrap" style="display:none">
          <summary>응답 헤더</summary><pre id="st-resp-headers"></pre>
        </details>
        <pre class="resp-body" id="st-resp-body" style="display:none"></pre>
        <div class="resp-empty" id="st-resp-empty">전송하면 상태·시간·크기·인코딩·헤더·본문이 여기에 표시됩니다.</div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { TEST_ENVS, buildTestUrl, REQUEST_TYPES, getRequestType } from './tester.js';
import { parseHeaderText, buildDefaultHeaderText, decodeTmapBody, coerceJson, extractTmapErrorHint } from '../DltLogViewer/js/poi-search.js';

const $ = id => document.getElementById(id);
const menuEl = $('st-menu'), envSel = $('st-env'), methodSel = $('st-method'), urlEl = $('st-url');
const headersEl = $('st-headers'), bodyEl = $('st-body'), curLabel = $('st-current-label');
const respHead = $('st-resp-head'), respHint = $('st-resp-hint'), respBody = $('st-resp-body');
const respHeadersWrap = $('st-resp-headers-wrap'), respHeaders = $('st-resp-headers'), respEmpty = $('st-resp-empty');
let currentId = REQUEST_TYPES[0].id;

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ---- 좌측 메뉴 (레지스트리 기반, 확장 가능) ----
function renderMenu(){
  menuEl.innerHTML = REQUEST_TYPES.map(r => {
    const wip = r.implemented === false ? ` <span class="mi-wip">미구현</span>` : '';
    return `<button class="menu-item${r.id===currentId?' active':''}" data-id="${r.id}">
       ${esc(r.label)}${wip}<span class="mi-path">${esc(r.path)}</span>
     </button>`;
  }).join('');
  menuEl.querySelectorAll('.menu-item').forEach(b =>
    b.addEventListener('click', () => selectType(b.dataset.id)));
}

function fillUrl(){ const t=getRequestType(currentId); urlEl.value = buildTestUrl(envSel.value, t.path); }

function fillBody(){
  const t = getRequestType(currentId);
  let body = t.sampleBody();
  if (body && body.header && !body.header.reqTime) body.header.reqTime = nowReqTime();
  bodyEl.value = JSON.stringify(body, null, 2);
}

function selectType(id){
  currentId = id;
  const t = getRequestType(id);
  const wip = t.implemented === false;
  curLabel.textContent = '· ' + t.label + (wip ? ' (미구현)' : '');
  methodSel.value = t.method || 'POST';
  fillUrl(); fillBody(); renderMenu();
  // 미구현 타입은 전송 비활성화 + 안내
  const sendBtn = $('st-send');
  sendBtn.disabled = wip;
  sendBtn.textContent = wip ? '미구현' : '요청 전송';
  if (wip){
    respEmpty.style.display='none';
    respHead.innerHTML = '<span class="resp-badge err">미구현</span><span class="resp-meta">이 요청 타입은 아직 구현되지 않았습니다 — 요청 포맷 확정 후 제공 예정</span>';
    respBody.style.display='none'; respHeadersWrap.style.display='none'; respHint.className='resp-hint';
  } else {
    respHead.innerHTML = '<span class="resp-meta">아직 요청을 보내지 않았습니다.</span>';
    respEmpty.style.display=''; respBody.style.display='none'; respHeadersWrap.style.display='none';
  }
}

function nowReqTime(){
  const n=new Date();
  return n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+
    String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0')+String(n.getSeconds()).padStart(2,'0');
}

envSel.addEventListener('change', fillUrl);
$('st-prettify').addEventListener('click', () => {
  try { bodyEl.value = JSON.stringify(JSON.parse(bodyEl.value), null, 2); }
  catch(e){ alert('JSON 파싱 오류: '+e.message); }
});
$('st-reset').addEventListener('click', () => { fillUrl(); fillBody(); });

function showResp({ status, statusText, ok, elapsed, size, encoding, isBinary, headersObj, bodyText }){
  respEmpty.style.display='none';
  const badge = ok ? `<span class="resp-badge ok">${status} ${esc(statusText)}</span>`
                   : `<span class="resp-badge err">${status||'ERR'} ${esc(statusText||'')}</span>`;
  respHead.innerHTML = badge +
    `<span class="resp-meta">${elapsed}ms · ${size}B · ${esc(encoding||'-')}${isBinary?' · binary(CP949)':''}</span>`;
  const hint = extractTmapErrorHint(bodyText||'');
  respHint.className = 'resp-hint' + (hint?' show':'');
  respHint.textContent = hint || '';
  if (headersObj){
    respHeadersWrap.style.display='';
    respHeaders.textContent = Object.entries(headersObj).map(([k,v])=>`${k}: ${v}`).join('\n');
  } else respHeadersWrap.style.display='none';
  const json = coerceJson(bodyText||'');
  respBody.style.display='';
  respBody.textContent = json ? JSON.stringify(json, null, 2) : (bodyText || '(빈 응답)');
}

$('st-send').addEventListener('click', async () => {
  const url = urlEl.value.trim();
  const method = methodSel.value;
  const { headers, skipped } = parseHeaderText(headersEl.value);
  const sendBtn = $('st-send');
  respEmpty.style.display='none'; respHint.className='resp-hint';
  const missAuth = skipped.filter(k=>/^(AccessKey|AccessToken)$/i.test(k));
  respHead.innerHTML = `<span class="resp-meta">전송 중...${missAuth.length?` (⚠ ${missAuth.join(', ')} 미입력)`:''}</span>`;
  respBody.style.display='none'; respHeadersWrap.style.display='none';
  sendBtn.disabled = true;
  const t0 = performance.now();
  try{
    const init = { method, headers };
    if (method !== 'GET') init.body = bodyEl.value;
    const resp = await fetch(url, init);
    const buf = await resp.arrayBuffer();
    const ct = resp.headers.get('content-type') || '';
    const bodyText = decodeTmapBody(new Uint8Array(buf), ct);
    const headersObj = {}; resp.headers.forEach((v,k)=>headersObj[k]=v);
    const isBinary = /binary/i.test(ct) || (!/json|text/i.test(ct) && !coerceJson(bodyText));
    showResp({
      status: resp.status, statusText: resp.statusText, ok: resp.ok,
      elapsed: Math.round(performance.now()-t0), size: buf.byteLength,
      encoding: /charset=([\w-]+)/i.exec(ct)?.[1] || (isBinary?'euc-kr':'utf-8'),
      isBinary, headersObj, bodyText,
    });
  }catch(e){
    respEmpty.style.display='none';
    respHead.innerHTML = `<span class="resp-badge err">실패</span><span class="resp-meta">${Math.round(performance.now()-t0)}ms</span>`;
    respBody.style.display=''; respBody.textContent = '요청 실패 (CORS/프록시 필요할 수 있음): '+e.message;
  }finally{ sendBtn.disabled=false; }
});

// init
headersEl.value = buildDefaultHeaderText();
renderMenu();
selectType(currentId);
</script>
</body>
</html>
